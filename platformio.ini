; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266@2.6.3
board = nodemcuv2
framework = arduino

upload_protocol = espota
upload_port = SmallDesktopDisplay.local

build_flags =
	-I include
	-include TFT_User_Setup.h
lib_deps = 
	adafruit/DHT sensor library@^1.4.3
	adafruit/Adafruit Unified Sensor@^1.1.4
	bblanchon/ArduinoJson@^6.18.5
	lennarthennigs/Button2@^1.6.5
	fastled/FastLED@3.4.0
	https://github.com/Bodmer/TJpg_Decoder.git#0.0.3
	https://github.com/Bodmer/TFT_eSPI.git#2.3.59
	https://github.com/PaulStoffregen/Time.git#v1.6
	https://github.com/tzapu/WiFiManager.git#2.0.5-beta
	boblemaire/asyncHTTPrequest@1.2.2
	me-no-dev/ESPAsyncTCP@1.2.2

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266@2.6.3
board = nodemcuv2
framework = arduino
build_flags =
	-I include
	-include TFT_User_Setup.h
lib_deps = 
	adafruit/DHT sensor library@^1.4.3
	adafruit/Adafruit Unified Sensor@^1.1.4
	bblanchon/ArduinoJson@^6.18.5
	lennarthennigs/Button2@^1.6.5
	fastled/FastLED@^3.4.0
	bodmer/TJpg_Decoder@0.0.3
	ivanseidel/Thread@0.0.0-alpha+sha.1a4e504c5f
	https://github.com/Bodmer/TFT_eSPI.git#2.3.59
upload_protocol = espota
upload_port = SmallDesktopDisplay.local
